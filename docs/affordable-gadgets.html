<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affordable Gadgets storefront API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; }
    .note { margin: 0; padding: 0.8rem 1.25rem; background: #111; color: #f4f4f4; font: 15px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .note a { color: #f4f4f4; }
  </style>
</head>
<body>
  <p class="note">Catalogue, search, and a financing enquiry. Payments, refunds, and staff routes are not here, and this page cannot call the live API. <a href="../index.html">Back to the portfolio</a></p>
  <div id="swagger"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "affordable-gadgets-storefront.openapi.yaml",
      dom_id: "#swagger",
      supportedSubmitMethods: [],
      tryItOutEnabled: false
    });
  </script>
</body>
</html>
